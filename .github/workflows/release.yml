# Publish the macOS disk image when a release reaches master.
#
# master receives only a verified release or a hotfix, each with a version no
# release has had (RELEASING.md), so a push to master that carries such a
# version is the release itself: this tags that commit `v<version>`, builds the
# disk image and attaches it to a GitHub release. Merging the release pull
# request is the decision; there is no tag for somebody to push by hand
# afterwards, and so no window in which master has a release macOS does not.
# Any other push to master — one whose version already has its tag — publishes
# nothing.
#
# Nothing is checked here: the release pull request already passed every
# check on exactly this tree (`check`, the Linux and Windows source builds,
# and `macos-package`, which is this same build from the shared
# `.github/actions/macos-package`), and `release-gate` made sure the squash is
# that tree. This only builds and publishes. A run started by hand builds the
# artefact and publishes nothing.
#
# The runner is `macos-14`, pinned rather than `macos-latest`, because the
# runner image decides the architecture of the build and `latest` moves without
# telling anyone. It is Apple Silicon, which matches the only arch this app
# packages for.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes to master in a row are two releases; the second waits for the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The tag this push releases, or none (RELEASING.md). Cheap, so a push to
  # master that releases nothing does not hold a macOS runner.
  decide:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # Full history and tags, to tell a new version from one already released.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release
        run: node scripts/release.mjs released

  macos:
    needs: decide
    if: needs.decide.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/macos-package
        with:
          release-build: ${{ needs.decide.outputs.tag != '' && '1' || '0' }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          macos-certificate: ${{ secrets.MACOS_CERTIFICATE }}
          macos-certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          apple-api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

      # Only for a new version on master. It creates the tag on the commit
      # that was built; a manual run leaves the artefact and publishes nothing.
      - if: needs.decide.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.decide.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: apps/desktop/release/*.dmg
          # Said on the release itself, because it is the first thing a
          # downloader meets and the last thing they will read afterwards.
          body: |
            macOS, Apple Silicon.

            macOS: desktop app and CLI. Linux: CLI. Windows support is coming soon – building from source is possible for experimentation, but Windows is not yet officially supported and some features may not work.

            A signed, notarised build opens on a double-click. If this one was
            built without the signing secrets, macOS refuses it on the first
            try — let it be refused, then allow it once:

            - **macOS 15 and later** — System Settings ▸ Privacy & Security ▸
              *Open Anyway*, at the bottom.
            - **macOS 14 and earlier** — right-click the app in Applications
              and choose *Open*.

            After that it launches normally. A signed build needs none of this.

  # The next release starts collecting at once (RELEASING.md, *After the
  # release*): `<this version>-next` from the commit just released, the open
  # pull requests moved onto it, and the previous next-release branch, now
  # squashed into master, deleted. Only after the release is published.
  next-branch:
    needs: [decide, macos]
    if: needs.decide.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release.mjs next-branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED_SHA: ${{ github.sha }}
