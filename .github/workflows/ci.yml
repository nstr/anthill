# Typecheck and test every pull request, while it is opened and updated.
#
# Pull requests are the only place checks run. Work reaches a next-release
# branch (`<version>-next`) and master only through pull requests, so a push
# to either is a merge of something these checks already passed, and running
# them again on it would only repeat them.
#
# `check` (typecheck and tests on `macos-14`, Apple Silicon) runs on every pull
# request. It builds no app and uses no secrets: `pull_request` from a fork
# gets none, and none are needed.
#
# A pull request into master is a release or a hotfix (RELEASING.md), and it
# gets the rest as well: builds from source on Linux and Windows the way the
# README tells people to, and the macOS app packaged and signed
# (`macos-package`). They run on GitHub's merge of the pull request into
# master, whose tree `release-gate` requires to be exactly the head's — the
# commit the release verifies. Updating the branch reruns them. A green Linux or
# Windows job means the tree installs, builds,
# passes its tests (Linux) and the CLI starts and serves its page there. It is
# not E2E on that platform, and macOS passing proves nothing about either.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run moot.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Electron-ABI copy of better-sqlite3, which the desktop tests load.
      - run: node apps/desktop/scripts/fetch-electron-sqlite.mjs

      - run: npm run typecheck
      - run: npm test

  # Linux is supported for the CLI, built from source on master.
  linux-source:
    if: github.event_name != 'pull_request' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node apps/desktop/scripts/fetch-electron-sqlite.mjs
      - run: npm test

      # The README's Linux install, then one start of the CLI.
      - run: npm run build
      - run: npm install --global ./apps/cli
      - run: node scripts/smoke-cli.mjs

  # Windows is experimental: no release, no support. This only says whether the
  # README's from-source steps still build and start; its tests are not run.
  windows-source:
    if: github.event_name != 'pull_request' || github.base_ref == 'master'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm install --global ./apps/cli
      - run: node scripts/smoke-cli.mjs

  # The macOS disk image, built and signed the way the Release workflow will
  # publish it, from the same `.github/actions/macos-package`. It runs on pull
  # requests into master, so the commit a release verifies has been packaged
  # before it merges; the Release workflow then builds it again on master and
  # publishes it. Nothing is published here.
  macos-package:
    if: github.event_name != 'pull_request' || github.base_ref == 'master'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Signed and notarised when the secrets are there, as a release is: a
      # signing failure belongs on the candidate, not on master. A pull request
      # from a fork gets no secrets and builds ad-hoc signed.
      - uses: ./.github/actions/macos-package
        with:
          macos-certificate: ${{ secrets.MACOS_CERTIFICATE }}
          macos-certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          apple-api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
